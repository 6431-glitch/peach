name: Issue 模板检查

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 只输出判定、不改动的 issue 编号
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.repository == 'peach-mitao/peach' && (github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.changes.body)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 判定并处理
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          ACTION: ${{ github.event.action || 'opened' }}
          PYTHONUTF8: '1'
        run: |
          # 排队期间正文和开闭状态可能已改变，始终判定当前内容。
          event="$RUNNER_TEMP/event.json"
          gh api "repos/$GH_REPO/issues/$NUMBER" | jq --arg action "$ACTION" '{action: $action, issue: .}' > "$event"
          verdict=$(python scripts/issue_intake.py --event "$event")
          echo "#$NUMBER: $verdict"
          if [ "$DRY_RUN" = true ]; then
            exit 0
          fi
          read -r action kind <<< "$verdict"
          case "$action" in
            type)
              gh issue edit "$NUMBER" --type "$kind"
              ;;
            close)
              python scripts/issue_intake.py --notice > "$RUNNER_TEMP/notice.md"
              gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/notice.md"
              gh issue edit "$NUMBER" --add-label status:needs-template
              gh issue close "$NUMBER" --reason "not planned"
              ;;
            reopen)
              gh issue reopen "$NUMBER"
              gh issue edit "$NUMBER" --remove-label status:needs-template --type "$kind"
              ;;
          esac
